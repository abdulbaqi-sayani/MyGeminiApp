<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جيمناي السياني</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 80%;
            max-width: 400px;
        }

        .btn {
            display: block;
            padding: 15px;
            text-align: center;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            border: none;
            color: white;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* ألوان مستوحاة من صورتك العلمية */
        .btn-camera { background-color: #27ae60; } 
        .btn-upload { background-color: #2980b9; } 
        .btn-audio  { background-color: #8e44ad; }

        /* تأثير الحركة واللون عند التسجيل النشط للميكروفون */
        .btn-audio.recording {
            background-color: #e74c3c !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <h1>جيمناي السياني</h1>

    <div class="container">
        <label class="btn btn-camera">
            📷 فتح الكاميرا
            <input type="file" accept="image/*" capture="environment">
        </label>

        <label class="btn btn-upload">
            📁 تحميل ملف
            <input type="file">
        </label>

        <button id="micBtn" class="btn btn-audio">
            🎤 سجل صوتك مباشرة
        </button>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        let recognition;
        let isRecording = false;

        // التحقق الآمن من دعم المتصفح والنظام لتسجيل وتحويل الصوت
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            micBtn.disabled = true;
            micBtn.style.backgroundColor = "#7f8c8d";
            micBtn.textContent = "🎤 الميكروفون غير مدعوم في هذا النظام";
        } else {
            // تهيئة واجهة التعرف على الصوت
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA'; // تعيين اللغة للغة العربية
            recognition.continuous = false; // التوقف تلقائياً عند سكوت المستخدم
            recognition.interimResults = false;

            // الأحداث البرمجية (Events):
            
            // 1. عند بدء التسجيل الفعلي
            recognition.onstart = () => {
                isRecording = true;
                micBtn.textContent = "🛑 جاري الاستماع... تحدث الآن";
                micBtn.classList.add('recording');
            };

            // 2. معالجة الأخطاء (مثل رفض الصلاحيات)
            recognition.onerror = (event) => {
                console.error("خطأ في الميكروفون:", event.error);
                if (event.error === 'not-allowed') {
                    alert("يتعذر تشغيل الميكروفون. يرجى إعطاء صلاحية الميكروفون للمتصفح أو التطبيق من إعدادات الهاتف.");
                } else {
                    alert("حدث خطأ أثناء محاولة التسجيل: " + event.error);
                }
            };

            // 3. عند التقاط الصوت وتحويله بنجاح إلى نص
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                console.log("النص المستخرج بنجاح:", transcript);
                
                // تنبيه مؤقت للمستخدم بالنتيجة
                alert("تم التقاط صوتك بنجاح! النص: \n\n" + transcript);
                
                // 💡 ملاحظة تطويرية: هنا يمكنك مستقبلاً استدعاء دالة إرسال النص لـ Gemini API
            };

            // 4. عند إغلاق الميكروفون أو انتهاء المستخدم من التحدث
            recognition.onend = () => {
                isRecording = false;
                micBtn.textContent = "🎤 سجل صوتك مباشرة";
                micBtn.classList.remove('recording');
            };

            // ربط الزر ببدء وإيقاف الميكروفون عند الضغط
            micBtn.addEventListener('click', () => {
                if (!isRecording) {
                    try {
                        recognition.start(); // هذا الأمر يجبر النظام على طلب الصلاحية وإظهارها في الإعدادات
                    } catch (e) {
                        console.error(e);
                    }
                } else {
                    recognition.stop();
                }
            });
        }
    </script>

</body>
</html>
