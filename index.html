<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جيمناي السياني</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 80%;
            max-width: 400px;
        }

        .btn {
            display: block;
            padding: 15px;
            text-align: center;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            border: none;
            color: white;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* ألوان الأزرار */
        .btn-camera { background-color: #27ae60; } 
        .btn-upload { background-color: #2980b9; } 
        .btn-audio  { background-color: #8e44ad; }

        /* حالة التسجيل النشط للميكروفون */
        .btn-audio.recording {
            background-color: #e74c3c !important; /* يتحول للون الأحمر عند التسجيل */
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <h1>جيمناي السياني</h1>

    <div class="container">
        <label class="btn btn-camera">
            📷 فتح الكاميرا
            <input type="file" accept="image/*" capture="environment">
        </label>

        <label class="btn btn-upload">
            📁 تحميل ملف
            <input type="file">
        </label>

        <button id="micBtn" class="btn btn-audio">
            🎤 سجل صوتك مباُشِرة
        </button>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        micBtn.addEventListener('click', async () => {
            // إذا لم يكن جاري التسجيل، ابدأ التسجيل
            if (!isRecording) {
                try {
                    // 1. طلب إذن الميكروفون من المستخدم
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    // 2. تهيئة مسجل الصوت
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    // تجميع البيانات الصوتية أثناء التحدث
                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    // عند إيقاف التسجيل، نقوم بمعالجة الملف الصوتي الناتجة
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        
                        console.log("تم حفظ الملف الصوتي بنجاح في الرابط التالي:", audioUrl);
                        alert("تم الانتهاء من تسجيل الصوت بنجاح وجاهز للإرسال إلى Gemini!");
                        
                        // هنا يمكنك مستقبلاً إرسال الـ audioBlob إلى السيرفر الخاص بـ Gemini API
                    };

                    // 3. بدء التسجيل وتحديث شكل الزر
                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.textContent = "🛑 جاري التسجيل... اضغط للإيقاف";
                    micBtn.classList.add('recording');

                } catch (err) {
                    console.error("خطأ في الوصول للميكروفون:", err);
                    alert("عذراً، لم نتمكن من تشغيل الميكروفون. تأكد من إعطاء الصلاحية للموقع وتأكد من أن الرابط يبدأ بـ https أو localhost");
                }
            } else {
                // إذا كان يسجل بالفعل، قم بإيقافه عند الضغط مجدداً
                mediaRecorder.stop();
                // إيقاف استخدام الميكروفون وإغلاق الإشارة (Stream) للحفاظ على الخصوصية
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                
                isRecording = false;
                micBtn.textContent = "🎤 سجل صوتك مباُشِرة";
                micBtn.classList.remove('recording');
            }
        });
    </script>

</body>
</html>
